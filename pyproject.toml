[project]
name = "pl-notes"
version = "0.1.0"
description = "Note about Polar"
readme = "README.md"
authors = [
    { name = "Lightbridge-KS", email = "ki11ip0.s.a.s@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "fastexcel>=0.21.0",
    "ipykernel>=7.4.0",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
    "numpy>=2.5.3",
    "nycflights13>=0.0.3",
    "palmerpenguins>=0.1.6",
    "pandas>=3.0.6",
    "polars>=1.0.0",
    "pyyaml>=6.0.3",
    "xlsxwriter>=3.2.9",
]


[build-system]
requires = ["uv_build>=0.11.8,<0.12.0"]
build-backend = "uv_build"
